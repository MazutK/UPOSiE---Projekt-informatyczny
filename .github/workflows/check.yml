name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalacja zależności
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Testy (pytest)
        run: |
          mkdir -p reports
          python -m pytest -v --junitxml=reports/pytest.xml 2>&1 | tee reports/pytest.txt

      - name: Raport testów jako artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/
          if-no-files-found: warn
