[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heating-optimizer"
version = "0.2.0"
description = "Rdzeń obliczeniowy: model cieplny budynku i optymalizacja planu grzania (DP)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
heating-optimizer = "heating_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
heating_optimizer = ["data/*.csv", "data/*.json"]
